<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="回報 ChaiPhoto 問題">
  <title>問題回報 | ChaiPhoto</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <nav>
    <a href="/">首頁</a>
    <a href="/privacy">隱私政策</a>
    <a href="/terms">使用政策</a>
    <a href="/support">支援</a>
    <a href="/report">問題回報</a>
  </nav>

  <div class="hero">
    <p class="muted">ChaiPhoto Feedback</p>
    <h1>問題回報</h1>
    <p>請描述你遇到的狀況。不要附上私密照片、位置、Apple ID、電話或其他敏感資料。</p>
  </div>

  <section>
    <form id="feedback-form">
      <label>
        問題類型
        <select name="category" required>
          <option value="crash">App 閃退</option>
          <option value="performance">卡頓／效能</option>
          <option value="photos">照片整理</option>
          <option value="videos">影片功能</option>
          <option value="icloud">iCloud</option>
          <option value="ui">介面／顯示</option>
          <option value="suggestion">功能建議</option>
          <option value="other" selected>其他</option>
        </select>
      </label>

      <label>
        問題描述
        <textarea name="description" rows="7" minlength="5" maxlength="5000" required
          placeholder="例如：滑到第三張照片時畫面卡住，返回首頁後恢復。"></textarea>
      </label>

      <label>
        重現步驟（選填）
        <textarea name="steps" rows="5" maxlength="5000"
          placeholder="例如：打開 App → 選 2026 年 9 月 → 連續右滑三張照片。"></textarea>
      </label>

      <div class="form-grid">
        <label>
          App 版本（選填）
          <input name="appVersion" maxlength="40" placeholder="例如 1.2.5">
        </label>
        <label>
          Build（選填）
          <input name="buildNumber" maxlength="40" placeholder="例如 34">
        </label>
        <label>
          iOS 版本（選填）
          <input name="iosVersion" maxlength="80" placeholder="例如 iOS 27.0">
        </label>
        <label>
          iPhone 型號（選填）
          <input name="deviceModel" maxlength="120" placeholder="例如 iPhone 17 Pro">
        </label>
      </div>

      <label class="honeypot" aria-hidden="true">
        Website
        <input name="website" tabindex="-1" autocomplete="off">
      </label>

      <button id="submit-button" class="primary-button" type="submit">送出回報</button>
      <p id="form-status" class="muted" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section>
    <h2>TestFlight 使用者</h2>
    <p>若問題包含閃退或需要附圖，也可以同時使用 TestFlight 內建的 Beta Feedback。網站回報與 TestFlight 回報可以並存。</p>
  </section>

  <footer>© 2026 ChaiPhoto</footer>
</main>

<script>
const form = document.getElementById("feedback-form");
const statusEl = document.getElementById("form-status");
const submitButton = document.getElementById("submit-button");
const params = new URLSearchParams(location.search);

for (const [key, param] of [
  ["appVersion", "version"],
  ["buildNumber", "build"],
  ["iosVersion", "ios"],
  ["deviceModel", "device"]
]) {
  const value = params.get(param);
  if (value && form.elements[key]) form.elements[key].value = value.slice(0, 120);
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  submitButton.disabled = true;
  statusEl.textContent = "正在送出…";

  const data = Object.fromEntries(new FormData(form).entries());

  try {
    const response = await fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || "提交失敗");

    form.reset();
    statusEl.textContent = "已收到，謝謝你的回報。回報編號：" + result.id;
  } catch (error) {
    statusEl.textContent = "送出失敗，請稍後再試。";
  } finally {
    submitButton.disabled = false;
  }
});
</script>
</body>
</html>
