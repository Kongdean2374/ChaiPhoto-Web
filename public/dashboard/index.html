<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>回報管理 | ChaiPhoto</title>

  <link rel="stylesheet" href="/styles.css">

  <style>
    .visibility-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 700;
      border: 1px solid var(--line);
      background: var(--bg);
    }

    .visibility-badge.public {
      color: #2fa36b;
    }

    .visibility-badge.private {
      color: var(--muted);
    }

    .public-editor {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 14px;
    }

    .public-editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .public-editor-header h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .public-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
    }

    .public-toggle input {
      width: auto;
      transform: scale(1.15);
    }

    .public-fields {
      display: grid;
      gap: 12px;
    }

    .public-version-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .public-save-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .public-save-button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      padding: 11px 16px;
      cursor: pointer;
    }

    .public-save-button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .public-save-status {
      color: var(--muted);
      font-size: .88rem;
    }

    .updated-at {
      margin-top: 6px;
      font-size: .82rem;
      color: var(--muted);
    }

    @media (max-width: 620px) {
      .public-editor-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .public-version-grid {
        grid-template-columns: 1fr;
      }

      .public-save-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
<main>

  <div class="hero">
    <p class="muted">ChaiPhoto Dashboard</p>

    <h1>回報管理</h1>

    <p>
      這裡只顯示 ChaiPhoto 問題回報。
      頁面已由 Cloudflare Access 保護。
    </p>

    <p class="muted">
      使用者的原始回報不會自動公開。
      只有手動開啟「公開顯示」並填寫公開標題後，
      才會出現在公開問題列表。
    </p>
  </div>

  <section>

    <div
      class="dashboard-summary"
      id="summary">
    </div>

    <div class="dashboard-toolbar">

      <label>
        篩選狀態

        <select id="status-filter">
          <option value="">全部</option>
          <option value="new">未處理</option>
          <option value="in_progress">處理中</option>
          <option value="resolved">已解決</option>
          <option value="closed">已關閉</option>
        </select>
      </label>

      <button
        class="button dashboard-refresh"
        id="refresh-button"
        type="button">
        重新整理
      </button>

    </div>

    <p
      id="dashboard-status"
      class="muted"
      role="status"
      aria-live="polite">
      正在載入…
    </p>

  </section>

  <div id="feedback-list"></div>

  <footer>
    © 2026 ChaiPhoto
  </footer>

</main>

<script>

const statusLabels = {
  new: "未處理",
  in_progress: "處理中",
  resolved: "已解決",
  closed: "已關閉"
};

const categoryLabels = {
  crash: "App 閃退",
  performance: "卡頓／效能",
  photos: "照片整理",
  videos: "影片功能",
  icloud: "iCloud",
  ui: "介面／顯示",
  suggestion: "功能建議",
  other: "其他"
};

const summary =
  document.getElementById("summary");

const list =
  document.getElementById("feedback-list");

const statusText =
  document.getElementById("dashboard-status");

const filter =
  document.getElementById("status-filter");

const refresh =
  document.getElementById("refresh-button");


function make(tag, text, className) {
  const el = document.createElement(tag);

  if (
    text !== undefined &&
    text !== null
  ) {
    el.textContent = text;
  }

  if (className) {
    el.className = className;
  }

  return el;
}


function addMetaRow(
  container,
  label,
  value
) {
  if (!value) return;

  const row =
    make(
      "div",
      null,
      "feedback-meta-row"
    );

  row.append(
    make("strong", label),
    make("span", value)
  );

  container.append(row);
}


function formatDate(value) {
  if (!value) return "";

  try {
    return new Date(value)
      .toLocaleString("zh-TW");
  } catch {
    return value;
  }
}


function renderSummary(counts) {

  summary.replaceChildren();

  for (
    const key of [
      "new",
      "in_progress",
      "resolved",
      "closed"
    ]
  ) {

    const card =
      make(
        "button",
        null,
        "summary-card"
      );

    card.type = "button";
    card.dataset.status = key;

    card.append(
      make(
        "span",
        statusLabels[key],
        "summary-label"
      ),
      make(
        "strong",
        String(counts[key] || 0),
        "summary-count"
      )
    );

    card.addEventListener(
      "click",
      () => {
        filter.value = key;
        loadFeedback();
      }
    );

    summary.append(card);
  }
}


function createInput(
  labelText,
  value,
  placeholder
) {

  const label =
    make("label");

  label.append(
    document.createTextNode(labelText)
  );

  const input =
    document.createElement("input");

  input.value =
    value || "";

  input.placeholder =
    placeholder || "";

  label.append(input);

  return {
    label,
    input
  };
}


function createTextarea(
  labelText,
  value,
  placeholder
) {

  const label =
    make("label");

  label.append(
    document.createTextNode(labelText)
  );

  const textarea =
    document.createElement("textarea");

  textarea.rows = 4;

  textarea.value =
    value || "";

  textarea.placeholder =
    placeholder || "";

  label.append(textarea);

  return {
    label,
    textarea
  };
}


function renderFeedback(items) {

  list.replaceChildren();

  if (!items.length) {

    const empty =
      make("section");

    empty.append(
      make(
        "h2",
        "目前沒有符合條件的回報"
      ),
      make(
        "p",
        "乾淨得有點可疑，但先享受一下。",
        "muted"
      )
    );

    list.append(empty);

    return;
  }


  for (const item of items) {

    const card =
      make(
        "section",
        null,
        "feedback-card"
      );


    /*
     * ===============================
     * 原始問題與狀態
     * ===============================
     */

    const top =
      make(
        "div",
        null,
        "feedback-card-top"
      );

    const titleBox =
      make("div");

    titleBox.append(
      make(
        "span",
        categoryLabels[item.category]
          || item.category,
        "feedback-category"
      ),

      make(
        "h2",
        item.description
      )
    );


    const visibility =
      make(
        "span",
        Number(item.is_public) === 1
          ? "● 已公開"
          : "● 私人",
        Number(item.is_public) === 1
          ? "visibility-badge public"
          : "visibility-badge private"
      );

    titleBox.append(visibility);


    const select =
      make(
        "select",
        null,
        "status-select"
      );


    for (
      const key of [
        "new",
        "in_progress",
        "resolved",
        "closed"
      ]
    ) {

      const option =
        make(
          "option",
          statusLabels[key]
        );

      option.value = key;

      option.selected =
        item.status === key;

      select.append(option);
    }


    select.addEventListener(
      "change",
      async () => {

        const previous =
          item.status;

        select.disabled = true;

        try {

          const response =
            await fetch(
              "/dashboard/api/feedback",
              {
                method: "PATCH",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  id: item.id,
                  status: select.value
                })
              }
            );


          const result =
            await response.json();


          if (
            !response.ok ||
            !result.ok
          ) {
            throw new Error();
          }


          item.status =
            select.value;

          statusText.textContent =
            "狀態已更新。";


        } catch {

          select.value =
            previous;

          statusText.textContent =
            "更新狀態失敗，請稍後再試。";

        } finally {

          select.disabled = false;
        }
      }
    );


    top.append(
      titleBox,
      select
    );

    card.append(top);


    /*
     * ===============================
     * 原始回報資訊
     * ===============================
     */

    const meta =
      make(
        "div",
        null,
        "feedback-meta"
      );


    addMetaRow(
      meta,
      "時間",
      formatDate(item.created_at)
    );


    addMetaRow(
      meta,
      "App",
      item.app_version
        ? item.app_version +
          (
            item.build_number
              ? " (" +
                item.build_number +
                ")"
              : ""
          )
        : item.build_number
    );


    addMetaRow(
      meta,
      "iOS",
      item.ios_version
    );


    addMetaRow(
      meta,
      "裝置",
      item.device_model
    );


    addMetaRow(
      meta,
      "來源",
      item.source
    );


    card.append(meta);


    /*
     * ===============================
     * 重現步驟
     * ===============================
     */

    if (item.steps) {

      const steps =
        make(
          "div",
          null,
          "feedback-steps"
        );

      steps.append(
        make(
          "strong",
          "重現步驟"
        ),

        make(
          "p",
          item.steps
        )
      );

      card.append(steps);
    }


    /*
     * ===============================
     * 公開資訊管理
     * ===============================
     */

    const editor =
      make(
        "div",
        null,
        "public-editor"
      );


    const editorHeader =
      make(
        "div",
        null,
        "public-editor-header"
      );


    editorHeader.append(
      make(
        "h3",
        "公開問題資訊"
      )
    );


    const toggleLabel =
      make(
        "label",
        null,
        "public-toggle"
      );


    const toggle =
      document.createElement("input");

    toggle.type =
      "checkbox";

    toggle.checked =
      Number(item.is_public) === 1;


    toggleLabel.append(
      toggle,
      document.createTextNode(
        "公開顯示"
      )
    );


    editorHeader.append(
      toggleLabel
    );


    editor.append(
      editorHeader
    );


    const fields =
      make(
        "div",
        null,
        "public-fields"
      );


    const titleField =
      createInput(
        "公開標題",
        item.public_title,
        "例如：影片上下滑動偶爾卡住"
      );


    const noteField =
      createTextarea(
        "公開處理進度",
        item.public_note,
        "例如：已找到影片預載切換問題，正在測試修正。"
      );


    fields.append(
      titleField.label,
      noteField.label
    );


    const versionGrid =
      make(
        "div",
        null,
        "public-version-grid"
      );


    const versionField =
      createInput(
        "修復版本",
        item.fixed_version,
        "例如：1.0 Beta"
      );


    const buildField =
      createInput(
        "修復 Build",
        item.fixed_build,
        "例如：5"
      );


    versionGrid.append(
      versionField.label,
      buildField.label
    );


    fields.append(
      versionGrid
    );


    editor.append(
      fields
    );


    /*
     * ===============================
     * 儲存
     * ===============================
     */

    const saveRow =
      make(
        "div",
        null,
        "public-save-row"
      );


    const saveButton =
      make(
        "button",
        "儲存公開資訊",
        "public-save-button"
      );

    saveButton.type =
      "button";


    const saveStatus =
      make(
        "span",
        "",
        "public-save-status"
      );


    saveButton.addEventListener(
      "click",
      async () => {

        if (
          toggle.checked &&
          titleField.input.value
            .trim()
            .length < 3
        ) {

          saveStatus.textContent =
            "公開前請先填寫公開標題。";

          titleField.input.focus();

          return;
        }


        saveButton.disabled = true;

        saveStatus.textContent =
          "正在儲存…";


        try {

          const response =
            await fetch(
              "/dashboard/api/feedback",
              {
                method: "PATCH",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  id: item.id,

                  isPublic:
                    toggle.checked,

                  publicTitle:
                    titleField.input.value,

                  publicNote:
                    noteField.textarea.value,

                  fixedVersion:
                    versionField.input.value,

                  fixedBuild:
                    buildField.input.value
                })
              }
            );


          const result =
            await response.json();


          if (
            !response.ok ||
            !result.ok
          ) {

            throw new Error(
              result.error ||
              "Save failed"
            );
          }


          item.is_public =
            toggle.checked ? 1 : 0;

          item.public_title =
            titleField.input.value;

          item.public_note =
            noteField.textarea.value;

          item.fixed_version =
            versionField.input.value;

          item.fixed_build =
            buildField.input.value;

          item.updated_at =
            new Date().toISOString();


          visibility.textContent =
            toggle.checked
              ? "● 已公開"
              : "● 私人";


          visibility.className =
            toggle.checked
              ? "visibility-badge public"
              : "visibility-badge private";


          updated.textContent =
            "最後更新：" +
            formatDate(
              item.updated_at
            );


          saveStatus.textContent =
            toggle.checked
              ? "已儲存並公開。"
              : "已儲存，目前維持私人。";


        } catch (error) {

          saveStatus.textContent =
            "儲存失敗，請稍後再試。";

        } finally {

          saveButton.disabled =
            false;
        }
      }
    );


    saveRow.append(
      saveButton,
      saveStatus
    );


    editor.append(
      saveRow
    );


    /*
     * ===============================
     * 最後更新
     * ===============================
     */

    const updated =
      make(
        "div",
        item.updated_at
          ? "最後更新：" +
            formatDate(
              item.updated_at
            )
          : "尚未更新公開資訊",
        "updated-at"
      );


    editor.append(
      updated
    );


    card.append(
      editor
    );


    /*
     * ===============================
     * 回報 ID
     * ===============================
     */

    card.append(
      make(
        "p",
        "回報編號：" + item.id,
        "feedback-id"
      )
    );


    list.append(card);
  }
}


async function loadFeedback() {

  refresh.disabled = true;

  statusText.textContent =
    "正在載入…";


  const query =
    filter.value
      ? "?status=" +
        encodeURIComponent(
          filter.value
        )
      : "";


  try {

    const response =
      await fetch(
        "/dashboard/api/feedback" +
        query,
        {
          headers: {
            "Accept":
              "application/json"
          },

          cache:
            "no-store"
        }
      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.ok
    ) {

      throw new Error();
    }


    renderSummary(
      result.counts
    );


    renderFeedback(
      result.feedback
    );


    statusText.textContent =
      "共顯示 " +
      result.feedback.length +
      " 筆回報。";


  } catch {

    statusText.textContent =
      "讀取失敗。若剛完成部署，稍等一下再重新整理。";


    list.replaceChildren();

  } finally {

    refresh.disabled =
      false;
  }
}


filter.addEventListener(
  "change",
  loadFeedback
);


refresh.addEventListener(
  "click",
  loadFeedback
);


loadFeedback();

</script>

</body>
</html>
