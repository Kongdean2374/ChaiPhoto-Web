<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>回報管理 | ChaiPhoto</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    main { width:min(1120px,calc(100% - 24px)); padding-top:22px; }
    .hero { padding:18px 20px; }
    .hero h1 { font-size:clamp(1.8rem,6vw,2.7rem); }

    .toolbar-box {
      padding:14px;
      margin:10px 0;
      border-radius:18px;
      border:1px solid var(--line);
      background:var(--card);
    }

    .dashboard-summary {
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:7px;
    }

    .summary-card { padding:9px 10px; border-radius:13px; }
    .summary-label { font-size:.76rem; }
    .summary-count { font-size:1.3rem; margin-top:0; }

    .filters {
      display:grid;
      grid-template-columns:2fr repeat(6,minmax(120px,1fr)) auto;
      gap:8px;
      align-items:end;
      margin-top:12px;
    }

    .filter-label {
      display:grid;
      gap:4px;
      font-size:.78rem;
      font-weight:650;
    }

    .filter-label input,
    .filter-label select { padding:9px 10px; }

    .feedback-list { display:grid; gap:10px; }

    .feedback-item {
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--card);
      overflow:hidden;
    }

    .feedback-item.status-new { border-left:5px solid #b9b9bf; }
    .feedback-item.status-in_progress { border-left:5px solid #d6a21e; }
    .feedback-item.status-resolved { border-left:5px solid #2fa36b; }
    .feedback-item.status-closed { border-left:5px solid #d04b4b; }
    .feedback-item.status-deleted {
      border-left:5px solid #777780;
      opacity:.88;
    }

    .feedback-item summary {
      list-style:none;
      cursor:pointer;
      padding:13px 15px;
      user-select:none;
    }

    .feedback-item summary::-webkit-details-marker { display:none; }

    .feedback-summary {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:10px;
      align-items:center;
    }

    .feedback-title {
      font-weight:760;
      font-size:.98rem;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .feedback-subtitle {
      margin-top:4px;
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      color:var(--muted);
      font-size:.75rem;
    }

    .feedback-right { display:flex; align-items:center; gap:7px; }

    .mini-badge {
      display:inline-flex;
      align-items:center;
      border:1px solid var(--line);
      border-radius:999px;
      padding:3px 7px;
      font-size:.7rem;
      font-weight:800;
      white-space:nowrap;
    }

    .status-badge-new { color:var(--muted); }
    .status-badge-in_progress { color:#d39a19; }
    .status-badge-resolved { color:#2fa36b; }
    .status-badge-closed { color:#d04b4b; }
    .status-badge-deleted { color:#777780; }
    .visibility-public { color:#2fa36b; }
    .visibility-private { color:var(--muted); }

    .chevron { color:var(--muted); transition:transform .18s ease; }
    .feedback-item[open] .chevron { transform:rotate(90deg); }

    .feedback-detail {
      padding:0 15px 16px;
      border-top:1px solid var(--line);
    }

    .detail-section {
      padding-top:14px;
      margin-top:14px;
      border-top:1px solid var(--line);
    }

    .detail-section:first-child { border-top:0; margin-top:0; }
    .detail-section h3 { margin:0 0 9px; font-size:.98rem; }

    .description-full { white-space:pre-wrap; margin:0; }

    .meta-grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:6px 14px;
      margin-top:10px;
      font-size:.82rem;
    }

    .meta-row {
      display:grid;
      grid-template-columns:92px minmax(0,1fr);
      gap:8px;
    }

    .meta-row strong { color:var(--muted); font-weight:650; }

    .steps {
      margin-top:10px;
      padding:11px;
      background:var(--bg);
      border-radius:13px;
      white-space:pre-wrap;
    }

    .editor-grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    .editor-grid .wide { grid-column:1 / -1; }

    .inline-toggle {
      display:flex;
      align-items:center;
      gap:8px;
      font-size:.86rem;
      font-weight:700;
    }

    .inline-toggle input { width:auto; }

    .conditional {
      margin-top:10px;
      padding:12px;
      border-radius:14px;
      background:var(--bg);
      border:1px solid var(--line);
    }

    .eta-grid {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:8px;
    }

    .eta-grid input { padding:9px; }

    .action-row {
      display:flex;
      gap:9px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:12px;
    }

    .save-button,
    .restore-button,
    .danger-button {
      appearance:none;
      border:0;
      border-radius:12px;
      padding:10px 14px;
      color:#fff;
      font:inherit;
      font-weight:760;
      cursor:pointer;
    }

    .save-button { background:var(--accent); }
    .restore-button { background:#2f9f68; }
    .danger-button { background:#c93f3f; }
    .save-button:disabled,
    .restore-button:disabled,
    .danger-button:disabled { opacity:.55; }

    .save-status { color:var(--muted); font-size:.8rem; }
    .diag { margin:0; white-space:pre-wrap; font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--muted); }

    .source-badge-beta { color:#4f67c8; }
    .source-badge-tf { color:#8c5bb8; }

    .content-editor {
      display:grid;
      gap:12px;
    }

    .content-editor textarea {
      min-height:110px;
      resize:vertical;
    }

    .field-state-row {
      display:flex;
      flex-wrap:wrap;
      gap:8px 14px;
      align-items:center;
      margin-top:7px;
      color:var(--muted);
      font-size:.8rem;
    }

    .field-state-row label {
      display:flex;
      align-items:center;
      gap:6px;
      font-weight:650;
    }

    .field-state-row input { width:auto; }

    .original-box {
      margin-top:10px;
      padding:11px;
      border-radius:13px;
      border:1px dashed var(--line);
      background:var(--bg);
    }

    .original-box[hidden] { display:none; }
    .original-box pre {
      margin:6px 0 0;
      white-space:pre-wrap;
      font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
    }

    .secondary-button {
      appearance:none;
      border:1px solid var(--line);
      border-radius:12px;
      padding:9px 12px;
      background:var(--card);
      color:var(--text);
      font:inherit;
      font-weight:720;
      cursor:pointer;
    }

    .attachment-placeholder {
      padding:11px;
      border-radius:13px;
      background:var(--bg);
      color:var(--muted);
      font-size:.82rem;
    }

    .attachment-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:10px;
      margin-top:10px;
    }

    .attachment-card {
      border:1px solid var(--line);
      border-radius:14px;
      padding:8px;
      background:var(--bg);
    }

    .attachment-card img {
      width:100%;
      aspect-ratio:9 / 16;
      object-fit:contain;
      border-radius:10px;
      background:#111;
      display:block;
    }

    .attachment-meta {
      margin-top:7px;
      color:var(--muted);
      font-size:.75rem;
      line-height:1.45;
    }

    @media (max-width:900px) {
      .filters { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .filters .search-wrap { grid-column:1 / -1; }
      .filters .refresh-wrap { align-self:end; }
    }

    @media (max-width:640px) {
      main { width:min(100% - 18px,1120px); }
      .dashboard-summary { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .filters { grid-template-columns:1fr 1fr; }
      .filters .search-wrap { grid-column:1 / -1; }
      .editor-grid,.meta-grid { grid-template-columns:1fr; }
      .eta-grid { grid-template-columns:1fr 1fr; }
      .feedback-right .visibility-label { display:none; }
    }
  </style>
</head>

<body>
<main>
  <div class="hero">
    <p class="muted">ChaiPhoto Dashboard</p>
    <h1>回報管理</h1>
    <p>統一管理網站與 TestFlight 回報、編輯內容、更新處理進度與公開資訊。</p>
  </div>

  <div class="toolbar-box">
    <div class="dashboard-summary" id="summary"></div>

    <div class="filters">
      <label class="filter-label search-wrap">
        搜尋
        <input id="search-filter" type="search" placeholder="BETA / TF ID、描述、版本、裝置">
      </label>

      <label class="filter-label">
        來源
        <select id="source-filter">
          <option value="">全部</option>
          <option value="beta">網站回報</option>
          <option value="tf">TestFlight</option>
        </select>
      </label>

      <label class="filter-label">
        狀態
        <select id="status-filter">
          <option value="">全部</option>
          <option value="new">待處理</option>
          <option value="in_progress">處理中</option>
          <option value="resolved">已更新</option>
          <option value="closed">無法處理</option>
          <option value="deleted">已刪除</option>
        </select>
      </label>

      <label class="filter-label">
        類型
        <select id="category-filter"><option value="">全部</option></select>
      </label>

      <label class="filter-label">
        App 版本
        <select id="version-filter"><option value="">全部</option></select>
      </label>

      <label class="filter-label">
        Build
        <select id="build-filter"><option value="">全部</option></select>
      </label>

      <label class="filter-label">
        iOS
        <select id="ios-filter"><option value="">全部</option></select>
      </label>

      <label class="filter-label">
        裝置
        <select id="device-filter"><option value="">全部</option></select>
      </label>

      <div class="refresh-wrap">
        <button class="button dashboard-refresh" id="refresh-button" type="button">重新整理</button>
      </div>
    </div>

    <p id="dashboard-status" class="muted" role="status" aria-live="polite">正在載入…</p>
  </div>

  <div id="feedback-list" class="feedback-list"></div>

  <footer>© 2026 ChaiPhoto</footer>
</main>

<script>
const statusLabels = {
  new: "待處理",
  in_progress: "處理中",
  resolved: "已更新",
  closed: "無法處理",
  deleted: "已刪除"
};

const categoryLabels = {
  crash: "App 閃退",
  performance: "卡頓／效能",
  photos: "照片整理",
  videos: "影片功能",
  icloud: "iCloud",
  ui: "介面／顯示",
  suggestion: "功能建議",
  other: "其他"
};

const summary = document.getElementById("summary");
const list = document.getElementById("feedback-list");
const statusText = document.getElementById("dashboard-status");
const searchFilter = document.getElementById("search-filter");
const sourceFilter = document.getElementById("source-filter");
const statusFilter = document.getElementById("status-filter");
const categoryFilter = document.getElementById("category-filter");
const versionFilter = document.getElementById("version-filter");
const buildFilter = document.getElementById("build-filter");
const iosFilter = document.getElementById("ios-filter");
const deviceFilter = document.getElementById("device-filter");
const refresh = document.getElementById("refresh-button");

let loadedItems = [];

function make(tag, text, className) {
  const element = document.createElement(tag);
  if (text !== undefined && text !== null) element.textContent = text;
  if (className) element.className = className;
  return element;
}

function sourceKey(item) {
  if (item.source_key === "tf" || item.source === "testflight") return "tf";
  return "beta";
}

function sourceLabel(item) {
  return sourceKey(item) === "tf" ? "TestFlight" : "網站回報";
}

function reportId(item) {
  const number = Number(item.source_number || item.report_number) || 0;
  const prefix = sourceKey(item) === "tf" ? "TF" : "BETA";
  return prefix + "-" + String(number).padStart(3, "0");
}

function effectiveDescription(item) {
  if (item.description_state === "not_applicable") return "不適用";
  if (item.description_state === "missing") return "未提供描述";
  return item.edited_description || item.description || "未提供描述";
}

function effectiveSteps(item) {
  if (item.steps_state === "not_applicable") return "不適用";
  if (item.steps_state === "missing") return "未提供";
  return item.edited_steps || item.steps || "";
}

function displayStatus(item) {
  return item.deleted_at ? "deleted" : item.status;
}

function formatDate(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleString("zh-TW", {
    month:"numeric",
    day:"numeric",
    hour:"numeric",
    minute:"2-digit"
  });
}

function addMeta(container, label, value) {
  if (value === undefined || value === null || value === "") return;
  const row = make("div", null, "meta-row");
  row.append(make("strong", label), make("span", String(value)));
  container.append(row);
}

function uniqueValues(key) {
  return Array.from(new Set(
    loadedItems.map(function(item) { return item[key]; }).filter(Boolean)
  )).sort(function(a,b) {
    return String(a).localeCompare(String(b), "zh-TW", { numeric:true });
  });
}

function refillSelect(select, values) {
  const current = select.value;
  const first = select.options[0].cloneNode(true);
  select.replaceChildren(first);

  values.forEach(function(value) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    select.append(option);
  });

  if (values.includes(current)) select.value = current;
}

function setupFilters() {
  categoryFilter.replaceChildren(new Option("全部", ""));
  Object.entries(categoryLabels).forEach(function(entry) {
    categoryFilter.append(new Option(entry[1], entry[0]));
  });

  refillSelect(versionFilter, uniqueValues("app_version"));
  refillSelect(buildFilter, uniqueValues("build_number"));
  refillSelect(iosFilter, uniqueValues("ios_version"));
  refillSelect(deviceFilter, uniqueValues("device_model"));
}

function renderSummary(counts) {
  summary.replaceChildren();

  ["new","in_progress","resolved","closed","deleted"].forEach(function(key) {
    const button = make("button", null, "summary-card");
    button.type = "button";
    button.append(
      make("span", statusLabels[key], "summary-label"),
      make("strong", String(counts[key] || 0), "summary-count")
    );
    button.addEventListener("click", function() {
      statusFilter.value = key;
      renderFeedback();
    });
    summary.append(button);
  });
}

function matchesFilters(item) {
  const keyword = searchFilter.value.trim().toLowerCase();

  if (sourceFilter.value && sourceKey(item) !== sourceFilter.value) return false;
  if (statusFilter.value && displayStatus(item) !== statusFilter.value) return false;
  if (categoryFilter.value && item.category !== categoryFilter.value) return false;
  if (versionFilter.value && item.app_version !== versionFilter.value) return false;
  if (buildFilter.value && item.build_number !== buildFilter.value) return false;
  if (iosFilter.value && item.ios_version !== iosFilter.value) return false;
  if (deviceFilter.value && item.device_model !== deviceFilter.value) return false;

  if (!keyword) return true;

  return [
    reportId(item),
    item.description,
    item.steps,
    item.original_description,
    item.original_steps,
    item.edited_description,
    item.edited_steps,
    sourceLabel(item),
    item.app_version,
    item.build_number,
    item.ios_version,
    item.device_model,
    item.public_title,
    item.public_note,
    item.fixed_version,
    item.fixed_build,
    item.unable_reason,
    item.deletion_reason,
    categoryLabels[item.category]
  ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase()
    .includes(keyword);
}

function decomposeEta(total) {
  let seconds = Math.max(0, Number(total) || 0);
  const days = Math.floor(seconds / 86400);
  seconds %= 86400;
  const hours = Math.floor(seconds / 3600);
  seconds %= 3600;
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return { days, hours, minutes, seconds:secs };
}

function numericInput(labelText, value) {
  const label = make("label");
  label.append(document.createTextNode(labelText));
  const input = document.createElement("input");
  input.type = "number";
  input.min = "0";
  input.step = "1";
  input.inputMode = "numeric";
  input.placeholder = "0";
  input.value = value ? String(value) : "";
  label.append(input);
  return { label, input };
}

function createTextInput(labelText, value, placeholder) {
  const label = make("label");
  label.append(document.createTextNode(labelText));
  const input = document.createElement("input");
  input.value = value || "";
  input.placeholder = placeholder || "";
  label.append(input);
  return { label, input };
}

function createTextarea(labelText, value, placeholder) {
  const label = make("label");
  label.append(document.createTextNode(labelText));
  const textarea = document.createElement("textarea");
  textarea.value = value || "";
  textarea.placeholder = placeholder || "";
  textarea.rows = 4;
  label.append(textarea);
  return { label, textarea };
}

function renderPrivateMetadata(item) {
  if (!item.private_metadata_json) return null;

  let data;

  try {
    data = JSON.parse(item.private_metadata_json);
  } catch {
    return null;
  }

  const values = Object.entries(data || {}).filter(function(entry) {
    return entry[1] !== null && entry[1] !== undefined && entry[1] !== "";
  });

  if (!values.length) return null;

  const section = make("div", null, "detail-section");
  section.append(make("h3", "TestFlight 私有資訊"));

  const box = make("div", null, "meta-grid");
  const labels = {
    testerEmail:"Tester Email",
    testerFirstName:"Tester 名字",
    testerLastName:"Tester 姓氏",
    locale:"語系",
    timeZone:"時區",
    architecture:"架構",
    connectionType:"連線",
    batteryPercentage:"電量",
    deviceFamily:"裝置家族",
    appPlatform:"平台"
  };

  values.forEach(function(entry) {
    const key = entry[0];
    let value = entry[1];

    if (key === "batteryPercentage" && value !== null) {
      value = String(value) + "%";
    }

    addMeta(box, labels[key] || key, value);
  });

  section.append(box);
  return section;
}

async function loadAttachments(item, container) {
  container.replaceChildren(
    make("div", "正在讀取附件…", "attachment-placeholder")
  );

  try {
    const response = await fetch(
      "/dashboard/api/feedback/attachments?feedbackId=" +
      encodeURIComponent(item.id),
      {
        headers:{ "Accept":"application/json" },
        cache:"no-store"
      }
    );

    const result = await response.json();

    if (!response.ok || !result.ok) throw new Error();

    const attachments = result.attachments || [];
    container.replaceChildren();

    if (!attachments.length) {
      container.append(make("div", "目前沒有附件。", "attachment-placeholder"));
      return;
    }

    const grid = make("div", null, "attachment-grid");

    attachments.forEach(function(attachment) {
      const card = make("div", null, "attachment-card");

      if (
        attachment.available &&
        String(attachment.mime_type || "").startsWith("image/")
      ) {
        const image = document.createElement("img");
        image.src = attachment.url;
        image.alt = attachment.original_filename || "回報附件";
        image.loading = "lazy";
        card.append(image);
      } else {
        card.append(
          make(
            "div",
            attachment.available ? "附件可讀取" : "附件目前無法讀取",
            "attachment-placeholder"
          )
        );
      }

      const meta = make("div", null, "attachment-meta");
      meta.append(
        make("div", attachment.original_filename || "附件"),
        make(
          "div",
          [
            attachment.width && attachment.height
              ? attachment.width + "×" + attachment.height
              : "",
            attachment.mime_type || "",
            attachment.is_public ? "允許公開" : "僅後台"
          ].filter(Boolean).join(" · ")
        )
      );

      if (attachment.expires_at) {
        meta.append(make("div", "來源連結到期：" + formatDate(attachment.expires_at)));
      }

      card.append(meta);
      grid.append(card);
    });

    container.append(grid);
  } catch {
    container.replaceChildren(
      make("div", "附件讀取失敗。", "attachment-placeholder")
    );
  }
}

function createContentEditor(item) {
  const section = make("div", null, "detail-section");
  section.append(make("h3", "回報內容編輯"));

  if (item.deleted_at) {
    section.append(make("div", "已刪除回報不能編輯內容。", "attachment-placeholder"));
    return section;
  }

  const editor = make("div", null, "content-editor");

  const descriptionField = createTextarea(
    "問題描述",
    item.edited_description ?? item.description ?? "",
    "可整理、修正文句，或替只有截圖的回報補上描述"
  );
  descriptionField.textarea.rows = 5;

  const descriptionStateRow = make("div", null, "field-state-row");
  const descriptionMissing = make("label");
  const descriptionMissingInput = document.createElement("input");
  descriptionMissingInput.type = "checkbox";
  descriptionMissingInput.checked = item.description_state === "missing";
  descriptionMissing.append(descriptionMissingInput, document.createTextNode("未提供"));

  const descriptionNA = make("label");
  const descriptionNAInput = document.createElement("input");
  descriptionNAInput.type = "checkbox";
  descriptionNAInput.checked = item.description_state === "not_applicable";
  descriptionNA.append(descriptionNAInput, document.createTextNode("不適用"));

  descriptionStateRow.append(descriptionMissing, descriptionNA);
  descriptionField.label.append(descriptionStateRow);

  const stepsField = createTextarea(
    "發生時機／重現步驟",
    item.edited_steps ?? item.steps ?? "",
    "可補上重現方式；若沒有固定步驟，可標記不適用"
  );
  stepsField.textarea.rows = 5;

  const stepsStateRow = make("div", null, "field-state-row");
  const stepsMissing = make("label");
  const stepsMissingInput = document.createElement("input");
  stepsMissingInput.type = "checkbox";
  stepsMissingInput.checked = item.steps_state === "missing";
  stepsMissing.append(stepsMissingInput, document.createTextNode("未提供"));

  const stepsNA = make("label");
  const stepsNAInput = document.createElement("input");
  stepsNAInput.type = "checkbox";
  stepsNAInput.checked = item.steps_state === "not_applicable";
  stepsNA.append(stepsNAInput, document.createTextNode("不適用"));

  stepsStateRow.append(stepsMissing, stepsNA);
  stepsField.label.append(stepsStateRow);

  function syncFieldState(textarea, missing, notApplicable) {
    if (missing.checked) {
      notApplicable.checked = false;
      textarea.disabled = true;
    } else if (notApplicable.checked) {
      missing.checked = false;
      textarea.disabled = true;
    } else {
      textarea.disabled = false;
    }
  }

  [
    [descriptionField.textarea, descriptionMissingInput, descriptionNAInput],
    [stepsField.textarea, stepsMissingInput, stepsNAInput]
  ].forEach(function(group) {
    const [textarea, missing, notApplicable] = group;
    missing.addEventListener("change", function() {
      syncFieldState(textarea, missing, notApplicable);
    });
    notApplicable.addEventListener("change", function() {
      syncFieldState(textarea, missing, notApplicable);
    });
    syncFieldState(textarea, missing, notApplicable);
  });

  editor.append(descriptionField.label, stepsField.label);

  const originalButton = make("button", "查看原始回報", "secondary-button");
  originalButton.type = "button";

  const originalBox = make("div", null, "original-box");
  originalBox.hidden = true;
  originalBox.append(
    make("strong", "原始問題描述"),
    make("pre", item.original_description || "（原本未提供）"),
    make("strong", "原始重現步驟"),
    make("pre", item.original_steps || "（原本未提供）")
  );

  originalButton.addEventListener("click", function() {
    originalBox.hidden = !originalBox.hidden;
    originalButton.textContent = originalBox.hidden
      ? "查看原始回報"
      : "收起原始回報";
  });

  const actionRow = make("div", null, "action-row");
  const save = make("button", "儲存回報內容", "save-button");
  save.type = "button";
  const status = make("span", "", "save-status");

  save.addEventListener("click", async function() {
    const descriptionState = descriptionNAInput.checked
      ? "not_applicable"
      : (descriptionMissingInput.checked ? "missing" : "provided");
    const stepsState = stepsNAInput.checked
      ? "not_applicable"
      : (stepsMissingInput.checked ? "missing" : "provided");

    if (
      descriptionState === "provided" &&
      !descriptionField.textarea.value.trim()
    ) {
      status.textContent = "問題描述為空，請填寫內容或標記「未提供／不適用」。";
      descriptionField.textarea.focus();
      return;
    }

    if (
      stepsState === "provided" &&
      !stepsField.textarea.value.trim()
    ) {
      status.textContent = "重現步驟為空，請填寫內容或標記「未提供／不適用」。";
      stepsField.textarea.focus();
      return;
    }

    save.disabled = true;
    status.textContent = "正在儲存…";

    try {
      const response = await fetch("/dashboard/api/feedback/content", {
        method:"PATCH",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          id:item.id,
          description:descriptionField.textarea.value,
          steps:stepsField.textarea.value,
          descriptionState,
          stepsState
        })
      });

      const result = await response.json();
      if (!response.ok || !result.ok) throw new Error();

      status.textContent = "內容已儲存。";
      await loadFeedback();
    } catch {
      status.textContent = "內容儲存失敗，請稍後再試。";
    } finally {
      save.disabled = false;
    }
  });

  actionRow.append(save, originalButton, status);
  section.append(editor, originalBox, actionRow);
  return section;
}

function createEditor(item, details) {
  const section = make("div", null, "detail-section");

  if (item.deleted_at) {
    section.append(make("h3", "已刪除回報"));

    const deletedInfo = make("div", null, "conditional");
    deletedInfo.append(
      make("strong", "刪除時間"),
      make("div", formatDate(item.deleted_at) || "未知")
    );

    if (item.deletion_reason) {
      deletedInfo.append(
        make("strong", "刪除原因"),
        make("div", item.deletion_reason)
      );
    }

    const legacyScrubbed =
      !String(item.description || "").trim() ||
      item.source === "deleted";

    if (legacyScrubbed) {
      const warning = make(
        "p",
        "這筆回報是在舊版刪除機制下移除，當時原始內容已被清除，因此現在只能保留回報 ID 與刪除紀錄，無法完整復原。",
        "save-status"
      );
      deletedInfo.append(warning);
    } else {
      const note = make(
        "p",
        "這筆回報只是從一般清單隱藏，原始內容仍保留，可以完整復原。",
        "save-status"
      );
      deletedInfo.append(note);
    }

    section.append(deletedInfo);

    const actionRow = make("div", null, "action-row");
    const restore = make("button", "復原回報", "restore-button");
    restore.type = "button";
    restore.disabled = legacyScrubbed;
    const restoreStatus = make("span", "", "save-status");

    restore.addEventListener("click", async function() {
      const confirmed = confirm("確定復原 " + reportId(item) + "？");
      if (!confirmed) return;

      restore.disabled = true;
      restoreStatus.textContent = "正在復原…";

      try {
        const response = await fetch("/dashboard/api/feedback/restore", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({ id:item.id })
        });

        const result = await response.json();

        if (response.status === 409 &&
            result.error === "legacy_deleted_content_unavailable") {
          restoreStatus.textContent = "舊版已清除原始內容，無法完整復原。";
          return;
        }

        if (!response.ok || !result.ok) throw new Error();

        restoreStatus.textContent = "已復原。";
        await loadFeedback();
      } catch {
        restoreStatus.textContent = "復原失敗，請稍後再試。";
      } finally {
        restore.disabled = legacyScrubbed;
      }
    });

    actionRow.append(restore, restoreStatus);
    section.append(actionRow);
    return section;
  }

  section.append(make("h3", "處理與公開設定"));

  const grid = make("div", null, "editor-grid");

  const statusLabel = make("label");
  statusLabel.append(document.createTextNode("狀態"));
  const statusSelect = document.createElement("select");
  ["new","in_progress","resolved","closed"].forEach(function(key) {
    const option = new Option(statusLabels[key], key);
    option.selected = item.status === key;
    statusSelect.append(option);
  });
  statusLabel.append(statusSelect);

  const publicLabel = make("label", null, "inline-toggle");
  const publicToggle = document.createElement("input");
  publicToggle.type = "checkbox";
  publicToggle.checked = Number(item.is_public) === 1;
  publicLabel.append(publicToggle, document.createTextNode("公開到「公開進度」"));

  const titleField = createTextInput("公開標題", item.public_title, "例如：照片滑動放手時偶爾卡頓");
  titleField.label.classList.add("wide");

  const noteField = createTextarea("公開說明／處理進度", item.public_note, "給測試者看的說明");
  noteField.label.classList.add("wide");

  grid.append(statusLabel, publicLabel, titleField.label, noteField.label);
  section.append(grid);

  const etaBox = make("div", null, "conditional");
  etaBox.append(make("strong", "預計處理時間"));
  const existingEta = decomposeEta(item.eta_seconds);
  const etaGrid = make("div", null, "eta-grid");
  const etaDays = numericInput("天", existingEta.days);
  const etaHours = numericInput("小時", existingEta.hours);
  const etaMinutes = numericInput("分鐘", existingEta.minutes);
  const etaSeconds = numericInput("秒", existingEta.seconds);
  etaGrid.append(etaDays.label, etaHours.label, etaMinutes.label, etaSeconds.label);
  etaBox.append(etaGrid);

  const fixedBox = make("div", null, "conditional");
  fixedBox.append(make("strong", "修復版本"));
  const fixedGrid = make("div", null, "editor-grid");
  const fixedVersion = createTextInput("版本", item.fixed_version, "例如 1.2.5");
  const fixedBuild = createTextInput("Build", item.fixed_build, "例如 42");
  const publishedLabel = make("label", null, "inline-toggle wide");
  const publishedToggle = document.createElement("input");
  publishedToggle.type = "checkbox";
  publishedToggle.checked = Number(item.fix_published) === 1;
  publishedLabel.append(publishedToggle, document.createTextNode("此修正版本已發布"));
  fixedGrid.append(fixedVersion.label, fixedBuild.label, publishedLabel);
  fixedBox.append(fixedGrid);

  const unableBox = make("div", null, "conditional");
  unableBox.append(make("strong", "無法處理原因"));
  const unableReason = document.createElement("textarea");
  unableReason.rows = 4;
  unableReason.placeholder = "例如：目前無法重現此問題，需要更多操作步驟。";
  unableReason.value = item.unable_reason || "";
  unableBox.append(unableReason);

  function updateConditional() {
    etaBox.hidden = statusSelect.value !== "in_progress";
    fixedBox.hidden = statusSelect.value !== "resolved";
    unableBox.hidden = statusSelect.value !== "closed";
  }

  statusSelect.addEventListener("change", updateConditional);
  updateConditional();

  section.append(etaBox, fixedBox, unableBox);

  const actionRow = make("div", null, "action-row");
  const save = make("button", "儲存變更", "save-button");
  save.type = "button";
  const remove = make("button", "刪除回報", "danger-button");
  remove.type = "button";
  const saveStatus = make("span", "", "save-status");

  save.addEventListener("click", async function() {
    const eta =
      (Number(etaDays.input.value) || 0) * 86400 +
      (Number(etaHours.input.value) || 0) * 3600 +
      (Number(etaMinutes.input.value) || 0) * 60 +
      (Number(etaSeconds.input.value) || 0);

    if (publicToggle.checked && titleField.input.value.trim().length < 3) {
      saveStatus.textContent = "公開前請填寫公開標題。";
      titleField.input.focus();
      return;
    }

    save.disabled = true;
    saveStatus.textContent = "正在儲存…";

    try {
      const response = await fetch("/dashboard/api/feedback", {
        method:"PATCH",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          id:item.id,
          status:statusSelect.value,
          etaSeconds:eta,
          isPublic:publicToggle.checked,
          publicTitle:titleField.input.value,
          publicNote:noteField.textarea.value,
          fixedVersion:fixedVersion.input.value,
          fixedBuild:fixedBuild.input.value,
          fixPublished:publishedToggle.checked,
          unableReason:unableReason.value
        })
      });

      const result = await response.json();
      if (!response.ok || !result.ok) throw new Error();

      saveStatus.textContent = "已儲存。";
      await loadFeedback();
    } catch {
      saveStatus.textContent = "儲存失敗，請稍後再試。";
    } finally {
      save.disabled = false;
    }
  });

  remove.addEventListener("click", async function() {
    const reason = prompt(
      "刪除後會移到「已刪除」，不再出現在公開進度；原始內容會保留在後台，之後仍可復原。\n\n可輸入刪除原因（可留空）：",
      ""
    );

    if (reason === null) return;

    const confirmed = confirm("確定將 " + reportId(item) + " 移到「已刪除」？");
    if (!confirmed) return;

    remove.disabled = true;
    saveStatus.textContent = "正在刪除…";

    try {
      const response = await fetch("/dashboard/api/feedback", {
        method:"DELETE",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          id:item.id,
          deletionReason:reason
        })
      });

      const result = await response.json();
      if (!response.ok || !result.ok) throw new Error();

      saveStatus.textContent = "已移到「已刪除」。";
      await loadFeedback();
    } catch {
      saveStatus.textContent = "刪除失敗，請稍後再試。";
    } finally {
      remove.disabled = false;
    }
  });

  actionRow.append(save, remove, saveStatus);
  section.append(actionRow);

  return section;
}

function renderFeedback() {
  list.replaceChildren();

  const items = loadedItems.filter(matchesFilters);
  statusText.textContent = "顯示 " + items.length + " / " + loadedItems.length + " 筆回報。";

  if (!items.length) {
    list.append(make("div", "目前沒有符合條件的回報。", "empty-state"));
    return;
  }

  items.forEach(function(item) {
    const details = document.createElement("details");
    const shownStatus = displayStatus(item);
    details.className = "feedback-item status-" + shownStatus;

    const summaryEl = document.createElement("summary");
    const summaryGrid = make("div", null, "feedback-summary");

    const main = make("div");
    const title = make(
      "div",
      reportId(item) + " · " + (
        shownStatus === "deleted"
          ? (effectiveDescription(item) || "已刪除回報")
          : effectiveDescription(item)
      ).replace(/\s+/g, " "),
      "feedback-title"
    );

    const subtitle = make("div", null, "feedback-subtitle");
    subtitle.append(
      make(
        "span",
        sourceLabel(item),
        "mini-badge source-badge-" + sourceKey(item)
      ),
      make("span", categoryLabels[item.category] || item.category || "其他"),
      make("span", "·"),
      make("span", formatDate(item.created_at))
    );
    if (item.app_version) {
      subtitle.append(make("span", "·"), make("span", "v" + item.app_version));
    }
    if (item.build_number) {
      subtitle.append(make("span", "Build " + item.build_number));
    }

    main.append(title, subtitle);

    const right = make("div", null, "feedback-right");
    const statusBadge = make(
      "span",
      statusLabels[shownStatus] || shownStatus,
      "mini-badge status-badge-" + shownStatus
    );
    const visibility = make(
      "span",
      shownStatus === "deleted"
        ? "已隱藏"
        : (Number(item.is_public) === 1 ? "公開" : "私人"),
      "mini-badge " + (
        shownStatus === "deleted"
          ? "visibility-private"
          : (Number(item.is_public) === 1 ? "visibility-public" : "visibility-private")
      )
    );
    visibility.classList.add("visibility-label");
    right.append(statusBadge, visibility, make("span", "›", "chevron"));

    summaryGrid.append(main, right);
    summaryEl.append(summaryGrid);

    const detail = make("div", null, "feedback-detail");

    const reportSection = make("div", null, "detail-section");
    reportSection.append(make("h3", "回報內容"));
    reportSection.append(make("p", effectiveDescription(item), "description-full"));

    const steps = make("div", null, "steps");
    steps.append(
      make("strong", "發生時機／重現步驟"),
      make("div", effectiveSteps(item) || "未提供")
    );
    reportSection.append(steps);

    const meta = make("div", null, "meta-grid");
    addMeta(meta, "回報 ID", reportId(item));
    addMeta(meta, "App", item.app_version);
    addMeta(meta, "Build", item.build_number);
    addMeta(meta, "iOS", item.ios_version);
    addMeta(meta, "裝置", item.device_model);
    addMeta(meta, "來源", sourceLabel(item));
    addMeta(meta, "附件", Number(item.attachment_count || 0) + " 個");
    if (item.deleted_at) {
      addMeta(meta, "刪除時間", formatDate(item.deleted_at));
      addMeta(meta, "刪除原因", item.deletion_reason);
    }
    reportSection.append(meta);
    detail.append(reportSection);

    if (item.diagnostics_json) {
      const diagSection = make("div", null, "detail-section");
      diagSection.append(make("h3", "額外系統資訊"));
      try {
        const parsed = JSON.parse(item.diagnostics_json);
        diagSection.append(make("pre", JSON.stringify(parsed, null, 2), "diag"));
      } catch {
        diagSection.append(make("pre", item.diagnostics_json, "diag"));
      }
      detail.append(diagSection);
    }

    detail.append(createContentEditor(item));

    const privateMetadataSection = renderPrivateMetadata(item);
    if (privateMetadataSection) detail.append(privateMetadataSection);

    const attachmentSection = make("div", null, "detail-section");
    attachmentSection.append(make("h3", "附件"));
    const attachmentContainer = make("div");
    attachmentContainer.append(
      make(
        "div",
        Number(item.attachment_count || 0) > 0
          ? "展開此回報後載入 " + Number(item.attachment_count) + " 個附件。"
          : "目前沒有附件。",
        "attachment-placeholder"
      )
    );
    attachmentSection.append(attachmentContainer);
    detail.append(attachmentSection);

    let attachmentsLoaded = false;
    details.addEventListener("toggle", function() {
      if (
        details.open &&
        !attachmentsLoaded &&
        Number(item.attachment_count || 0) > 0
      ) {
        attachmentsLoaded = true;
        loadAttachments(item, attachmentContainer);
      }
    });

    detail.append(createEditor(item, details));
    details.append(summaryEl, detail);
    list.append(details);
  });
}

function attachFilterEvents() {
  [
    searchFilter,
    sourceFilter,
    statusFilter,
    categoryFilter,
    versionFilter,
    buildFilter,
    iosFilter,
    deviceFilter
  ].forEach(function(control) {
    control.addEventListener(control.tagName === "INPUT" ? "input" : "change", renderFeedback);
  });
}

async function loadFeedback() {
  refresh.disabled = true;
  statusText.textContent = "正在載入…";

  try {
    const response = await fetch("/dashboard/api/feedback", {
      headers:{ "Accept":"application/json" },
      cache:"no-store"
    });

    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error();

    loadedItems = result.feedback || [];
    renderSummary(result.counts || {});
    setupFilters();
    renderFeedback();
  } catch {
    statusText.textContent = "讀取失敗，請稍後再試。";
    list.replaceChildren();
  } finally {
    refresh.disabled = false;
  }
}

refresh.addEventListener("click", loadFeedback);
attachFilterEvents();
loadFeedback();
</script>
</body>
</html>
