<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>回報管理 | ChaiPhoto</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    main {
      width: min(1000px, calc(100% - 24px));
      padding-top: 22px;
    }

    .hero {
      padding: 18px 20px;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 6vw, 2.7rem);
    }

    .dashboard-summary {
      gap: 7px;
    }

    .summary-card {
      padding: 9px 10px;
      border-radius: 13px;
    }

    .summary-label {
      font-size: .76rem;
    }

    .summary-count {
      font-size: 1.3rem;
      margin-top: 0;
    }

    .toolbar-box {
      padding: 14px;
      margin: 10px 0;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--card);
    }

    .dashboard-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px auto;
      gap: 8px;
      align-items: end;
      margin: 0;
    }

    .toolbar-label {
      gap: 4px;
      font-size: .82rem;
    }

    .toolbar-label input,
    .toolbar-label select {
      padding: 9px 11px;
    }

    .feedback-list {
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: var(--card);
    }

    .feedback-item {
      margin: 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
    }

    .feedback-item:last-child {
      border-bottom: 0;
    }

    .feedback-item summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 14px;
      user-select: none;
    }

    .feedback-item summary::-webkit-details-marker {
      display: none;
    }

    .feedback-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .feedback-main {
      min-width: 0;
    }

    .feedback-title {
      font-weight: 720;
      font-size: .96rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .feedback-subtitle {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: .75rem;
    }

    .feedback-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 7px;
      font-size: .7rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .visibility-public {
      color: #2fa36b;
    }

    .visibility-private {
      color: var(--muted);
    }

    .status-new { color: #4384e6; }
    .status-in_progress { color: #d89a24; }
    .status-resolved { color: #2fa36b; }
    .status-closed { color: var(--muted); }

    .chevron {
      color: var(--muted);
      font-size: 1rem;
      transition: transform .18s ease;
    }

    .feedback-item[open] .chevron {
      transform: rotate(90deg);
    }

    .feedback-detail {
      padding: 0 14px 16px;
      border-top: 1px solid var(--line);
    }

    .feedback-detail-inner {
      padding-top: 14px;
    }

    .detail-section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .detail-section:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .detail-section h3 {
      margin: 0 0 10px;
      font-size: .98rem;
    }

    .description-full {
      white-space: pre-wrap;
      margin: 0;
    }

    .feedback-meta {
      margin-top: 12px;
      padding-top: 0;
      border-top: 0;
      gap: 5px;
      font-size: .82rem;
    }

    .feedback-meta-row {
      grid-template-columns: 70px minmax(0, 1fr);
    }

    .feedback-steps {
      margin-top: 10px;
      padding: 11px;
    }

    .status-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 170px;
      gap: 10px;
      align-items: end;
    }

    .public-editor {
      display: grid;
      gap: 11px;
    }

    .public-editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .public-toggle {
      display: flex;
      grid-template-columns: none;
      align-items: center;
      gap: 8px;
      font-size: .88rem;
    }

    .public-toggle input {
      width: auto;
    }

    .public-fields {
      display: grid;
      gap: 10px;
    }

    .public-fields label {
      font-size: .84rem;
      gap: 5px;
    }

    .public-fields input,
    .public-fields textarea {
      padding: 9px 11px;
    }

    .public-fields textarea {
      min-height: 88px;
    }

    .public-version-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .save-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .save-button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      padding: 9px 14px;
      cursor: pointer;
    }

    .save-button:disabled {
      opacity: .55;
    }

    .save-status,
    .updated-at,
    .feedback-id {
      color: var(--muted);
      font-size: .76rem;
    }

    .feedback-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-wrap: anywhere;
    }

    .empty-state {
      padding: 30px 16px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 680px) {
      .dashboard-toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .dashboard-toolbar .search-wrap {
        grid-column: 1 / -1;
      }

      .status-control {
        grid-template-columns: 1fr;
      }

      .public-version-grid {
        grid-template-columns: 1fr;
      }

      .feedback-right .visibility-text {
        display: none;
      }
    }
  </style>
</head>

<body>
<main>
  <div class="hero">
    <p class="muted">ChaiPhoto Dashboard</p>
    <h1>回報管理</h1>
    <p>緊湊模式。點擊一筆回報即可展開詳細資料與公開設定。</p>
  </div>

  <div class="toolbar-box">
    <div class="dashboard-summary" id="summary"></div>

    <div class="dashboard-toolbar">
      <label class="toolbar-label search-wrap">
        搜尋
        <input id="feedback-search" type="search" placeholder="搜尋描述、裝置、版本、公開標題">
      </label>

      <label class="toolbar-label">
        狀態
        <select id="status-filter">
          <option value="">全部</option>
          <option value="new">未處理</option>
          <option value="in_progress">處理中</option>
          <option value="resolved">已解決</option>
          <option value="closed">已關閉</option>
        </select>
      </label>

      <button class="button dashboard-refresh" id="refresh-button" type="button">
        重新整理
      </button>
    </div>

    <p id="dashboard-status" class="muted" role="status" aria-live="polite">
      正在載入…
    </p>
  </div>

  <div id="feedback-list" class="feedback-list"></div>

  <footer>© 2026 ChaiPhoto</footer>
</main>

<script>
const statusLabels = {
  new: "未處理",
  in_progress: "處理中",
  resolved: "已解決",
  closed: "已關閉"
};

const categoryLabels = {
  crash: "App 閃退",
  performance: "卡頓／效能",
  photos: "照片整理",
  videos: "影片功能",
  icloud: "iCloud",
  ui: "介面／顯示",
  suggestion: "功能建議",
  other: "其他"
};

const summary = document.getElementById("summary");
const list = document.getElementById("feedback-list");
const statusText = document.getElementById("dashboard-status");
const filter = document.getElementById("status-filter");
const search = document.getElementById("feedback-search");
const refresh = document.getElementById("refresh-button");

let loadedItems = [];

function make(tag, text, className) {
  const el = document.createElement(tag);

  if (text !== undefined && text !== null) {
    el.textContent = text;
  }

  if (className) {
    el.className = className;
  }

  return el;
}

function formatDate(value, short = false) {
  if (!value) return "";

  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;

  return short
    ? date.toLocaleDateString("zh-TW", {
        month: "numeric",
        day: "numeric"
      })
    : date.toLocaleString("zh-TW");
}

function addMetaRow(container, label, value) {
  if (!value) return;

  const row = make("div", null, "feedback-meta-row");
  row.append(
    make("strong", label),
    make("span", value)
  );

  container.append(row);
}

function createInput(labelText, value, placeholder) {
  const label = make("label");
  label.append(document.createTextNode(labelText));

  const input = document.createElement("input");
  input.value = value || "";
  input.placeholder = placeholder || "";

  label.append(input);

  return { label, input };
}

function createTextarea(labelText, value, placeholder) {
  const label = make("label");
  label.append(document.createTextNode(labelText));

  const textarea = document.createElement("textarea");
  textarea.value = value || "";
  textarea.placeholder = placeholder || "";

  label.append(textarea);

  return { label, textarea };
}

function renderSummary(counts) {
  summary.replaceChildren();

  for (const key of ["new", "in_progress", "resolved", "closed"]) {
    const card = make("button", null, "summary-card");
    card.type = "button";

    card.append(
      make("span", statusLabels[key], "summary-label"),
      make("strong", String(counts[key] || 0), "summary-count")
    );

    card.addEventListener("click", () => {
      filter.value = key;
      loadFeedback();
    });

    summary.append(card);
  }
}

function createStatusSelect(item, badge) {
  const select = document.createElement("select");

  for (const key of ["new", "in_progress", "resolved", "closed"]) {
    const option = make("option", statusLabels[key]);
    option.value = key;
    option.selected = item.status === key;
    select.append(option);
  }

  select.addEventListener("change", async () => {
    const previous = item.status;
    select.disabled = true;

    try {
      const response = await fetch("/dashboard/api/feedback", {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          id: item.id,
          status: select.value
        })
      });

      const result = await response.json();

      if (!response.ok || !result.ok) {
        throw new Error();
      }

      item.status = select.value;

      badge.textContent = statusLabels[item.status];
      badge.className = "mini-badge status-" + item.status;

      statusText.textContent = "狀態已更新。";

      if (filter.value && filter.value !== item.status) {
        loadFeedback();
      }
    } catch {
      select.value = previous;
      statusText.textContent = "更新狀態失敗，請稍後再試。";
    } finally {
      select.disabled = false;
    }
  });

  return select;
}

function renderFeedback() {
  list.replaceChildren();

  const keyword = search.value.trim().toLowerCase();

  const items = loadedItems.filter(item => {
    if (!keyword) return true;

    return [
      item.description,
      item.steps,
      item.app_version,
      item.build_number,
      item.ios_version,
      item.device_model,
      item.public_title,
      item.public_note,
      item.fixed_version,
      item.fixed_build,
      item.id,
      categoryLabels[item.category]
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase()
      .includes(keyword);
  });

  statusText.textContent =
    `顯示 ${items.length} / ${loadedItems.length} 筆回報。`;

  if (!items.length) {
    const empty = make("div", "目前沒有符合條件的回報。", "empty-state");
    list.append(empty);
    return;
  }

  for (const item of items) {
    const details = document.createElement("details");
    details.className = "feedback-item";

    const summaryEl = document.createElement("summary");

    const summaryGrid = make("div", null, "feedback-summary");
    const main = make("div", null, "feedback-main");

    const title = make(
      "div",
      item.description || "未命名回報",
      "feedback-title"
    );

    const subtitle = make("div", null, "feedback-subtitle");

    subtitle.append(
      make("span", categoryLabels[item.category] || item.category || "其他"),
      make("span", "·"),
      make("span", formatDate(item.created_at, true))
    );

    if (item.device_model) {
      subtitle.append(
        make("span", "·"),
        make("span", item.device_model)
      );
    }

    main.append(title, subtitle);

    const right = make("div", null, "feedback-right");

    const visibilityBadge = make(
      "span",
      Number(item.is_public) === 1 ? "公開" : "私人",
      Number(item.is_public) === 1
        ? "mini-badge visibility-public"
        : "mini-badge visibility-private"
    );

    const statusBadge = make(
      "span",
      statusLabels[item.status] || item.status,
      "mini-badge status-" + item.status
    );

    const chevron = make("span", "›", "chevron");

    right.append(visibilityBadge, statusBadge, chevron);
    summaryGrid.append(main, right);
    summaryEl.append(summaryGrid);

    const detail = make("div", null, "feedback-detail");
    const detailInner = make("div", null, "feedback-detail-inner");

    const originalSection = make("div", null, "detail-section");
    originalSection.append(
      make("h3", "原始回報"),
      make("p", item.description, "description-full")
    );

    const meta = make("div", null, "feedback-meta");

    addMetaRow(meta, "時間", formatDate(item.created_at));

    addMetaRow(
      meta,
      "App",
      item.app_version
        ? item.app_version +
          (item.build_number ? " (" + item.build_number + ")" : "")
        : item.build_number
    );

    addMetaRow(meta, "iOS", item.ios_version);
    addMetaRow(meta, "裝置", item.device_model);
    addMetaRow(meta, "來源", item.source);

    originalSection.append(meta);

    if (item.steps) {
      const steps = make("div", null, "feedback-steps");
      steps.append(
        make("strong", "重現步驟"),
        make("p", item.steps)
      );

      originalSection.append(steps);
    }

    detailInner.append(originalSection);

    const statusSection = make("div", null, "detail-section");
    statusSection.append(make("h3", "處理狀態"));

    const statusControl = make("div", null, "status-control");

    const statusLabel = make("label");
    statusLabel.append(
      document.createTextNode("狀態"),
      createStatusSelect(item, statusBadge)
    );

    const visibilityInfo = make(
      "div",
      Number(item.is_public) === 1
        ? "目前已公開給使用者"
        : "目前只有管理者可見",
      "muted"
    );

    statusControl.append(statusLabel, visibilityInfo);
    statusSection.append(statusControl);

    detailInner.append(statusSection);

    const publicSection = make("div", null, "detail-section");
    publicSection.append(make("h3", "公開問題資訊"));

    const editor = make("div", null, "public-editor");

    const header = make("div", null, "public-editor-header");

    const toggleLabel = make("label", null, "public-toggle");
    const toggle = document.createElement("input");

    toggle.type = "checkbox";
    toggle.checked = Number(item.is_public) === 1;

    toggleLabel.append(
      toggle,
      document.createTextNode("公開顯示")
    );

    header.append(toggleLabel);
    editor.append(header);

    const fields = make("div", null, "public-fields");

    const titleField = createInput(
      "公開標題",
      item.public_title,
      "例如：影片上下滑動偶爾卡住"
    );

    const noteField = createTextarea(
      "公開處理進度",
      item.public_note,
      "例如：已找到問題原因，目前正在測試修正。"
    );

    fields.append(
      titleField.label,
      noteField.label
    );

    const versionGrid = make("div", null, "public-version-grid");

    const versionField = createInput(
      "修復版本",
      item.fixed_version,
      "例如：1.0 Beta"
    );

    const buildField = createInput(
      "修復 Build",
      item.fixed_build,
      "例如：5"
    );

    versionGrid.append(
      versionField.label,
      buildField.label
    );

    fields.append(versionGrid);
    editor.append(fields);

    const saveRow = make("div", null, "save-row");
    const saveButton = make("button", "儲存", "save-button");
    const saveStatus = make("span", "", "save-status");

    saveButton.type = "button";

    const updated = make(
      "div",
      item.updated_at
        ? "最後更新：" + formatDate(item.updated_at)
        : "尚未更新公開資訊",
      "updated-at"
    );

    saveButton.addEventListener("click", async () => {
      if (
        toggle.checked &&
        titleField.input.value.trim().length < 3
      ) {
        saveStatus.textContent = "公開前請先填寫公開標題。";
        titleField.input.focus();
        return;
      }

      saveButton.disabled = true;
      saveStatus.textContent = "正在儲存…";

      try {
        const response = await fetch("/dashboard/api/feedback", {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            id: item.id,
            isPublic: toggle.checked,
            publicTitle: titleField.input.value,
            publicNote: noteField.textarea.value,
            fixedVersion: versionField.input.value,
            fixedBuild: buildField.input.value
          })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error();
        }

        item.is_public = toggle.checked ? 1 : 0;
        item.public_title = titleField.input.value;
        item.public_note = noteField.textarea.value;
        item.fixed_version = versionField.input.value;
        item.fixed_build = buildField.input.value;
        item.updated_at = new Date().toISOString();

        visibilityBadge.textContent =
          toggle.checked ? "公開" : "私人";

        visibilityBadge.className =
          toggle.checked
            ? "mini-badge visibility-public"
            : "mini-badge visibility-private";

        visibilityInfo.textContent =
          toggle.checked
            ? "目前已公開給使用者"
            : "目前只有管理者可見";

        updated.textContent =
          "最後更新：" + formatDate(item.updated_at);

        saveStatus.textContent =
          toggle.checked
            ? "已儲存並公開。"
            : "已儲存，目前維持私人。";
      } catch {
        saveStatus.textContent = "儲存失敗，請稍後再試。";
      } finally {
        saveButton.disabled = false;
      }
    });

    saveRow.append(saveButton, saveStatus);

    editor.append(saveRow, updated);
    publicSection.append(editor);

    detailInner.append(publicSection);

    const idSection = make("div", null, "detail-section");
    idSection.append(
      make("div", "回報編號：" + item.id, "feedback-id")
    );

    detailInner.append(idSection);

    detail.append(detailInner);
    details.append(summaryEl, detail);

    list.append(details);
  }
}

async function loadFeedback() {
  refresh.disabled = true;
  statusText.textContent = "正在載入…";

  const query = filter.value
    ? "?status=" + encodeURIComponent(filter.value)
    : "";

  try {
    const response = await fetch(
      "/dashboard/api/feedback" + query,
      {
        headers: {
          "Accept": "application/json"
        },
        cache: "no-store"
      }
    );

    const result = await response.json();

    if (!response.ok || !result.ok) {
      throw new Error();
    }

    loadedItems = result.feedback || [];

    renderSummary(result.counts);
    renderFeedback();
  } catch {
    statusText.textContent = "讀取失敗，請稍後再試。";
    list.replaceChildren();
  } finally {
    refresh.disabled = false;
  }
}

filter.addEventListener("change", loadFeedback);
search.addEventListener("input", renderFeedback);
refresh.addEventListener("click", loadFeedback);

loadFeedback();
</script>
</body>
</html>
