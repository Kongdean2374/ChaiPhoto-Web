<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ChaiPhoto TestFlight</title>

<style>
:root{
  --bg:#000;
  --card:#1c1c1e;
  --text:#f5f5f7;
  --muted:#8e8e93;
  --line:#2c2c2e;
  --blue:#0a84ff;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
}

.card{
  width:min(560px,calc(100% - 32px));
  padding:30px;
  border:1px solid var(--line);
  border-radius:28px;
  background:var(--card);
  text-align:center;
}

.icon{
  width:86px;
  height:86px;
  margin:0 auto 20px;
  border-radius:20px;
  overflow:hidden;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  margin:0 0 12px;
  font-size:32px;
}

.status{
  display:inline-block;
  margin-bottom:18px;
  padding:7px 11px;
  border-radius:999px;
  background:rgba(255,159,10,.15);
  color:#ff9f0a;
  font-size:13px;
  font-weight:700;
}

p{
  color:var(--muted);
  font-size:17px;
  line-height:1.6;
}

button,
.back{
  display:inline-flex;
  min-height:46px;
  align-items:center;
  justify-content:center;
  margin-top:10px;
  padding:0 18px;
  border:0;
  border-radius:14px;
  font:inherit;
  font-weight:700;
}

button{
  background:#2c2c2e;
  color:#8e8e93;
}

.back{
  color:#0a84ff;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

  <div class="icon">
    <img src="/beta/images/icon.png" alt="ChaiPhoto">
  </div>

  <div class="status">
    尚未開放
  </div>

  <h1>ChaiPhoto TestFlight</h1>

  <p>
    公開 Beta 目前仍在準備／審核階段，
    因此 TestFlight 公開測試連結尚未啟用。
  </p>

  <p>
    這是一個固定入口，可以直接收藏。
    公開測試正式開放後，此頁將直接前往 ChaiPhoto 的 TestFlight。
  </p>

  <button disabled>
    TestFlight 尚未開放
  </button>

  <br>

  <a class="back" href="/beta">
    返回 ChaiPhoto Beta
  </a>

</div>

</body>
</html>
